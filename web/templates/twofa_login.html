{% extends 'base.html' %}
{% block title %}2FA{% endblock %}
{% block content %}
<style>
  .twofa-wrap{ max-width: 560px; margin: 2.5rem auto 0; }
  .twofa-card{
    background: var(--panel);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
  }
  .twofa-header{
    padding: 16px 18px;
    background: linear-gradient(180deg, rgba(255,204,0,0.10), rgba(255,255,255,0.02));
    border-bottom: 1px solid var(--card-border);
  }
  .twofa-title{ margin:0; color:#fff; font-weight: 800; letter-spacing: 0.2px; }
  .twofa-subtitle{ margin: 6px 0 0 0; color: var(--muted); font-size: 0.92rem; }
  .twofa-body{ padding: 18px; }
  .twofa-body .form-control{
    background: var(--panel);
    border: 1px solid var(--card-border);
    color: #fff !important;
    caret-color: #fff;
    border-radius: 12px;
    padding: 0.75rem 0.9rem;
  }
  .twofa-body .twofa-code-input{
    color: #fff !important;
    caret-color: #fff;
    -webkit-text-fill-color: #fff;
  }
  .twofa-body .twofa-code-input::placeholder{
    color: rgba(184, 193, 202, 0.55);
    opacity: 1;
  }
  .twofa-body input.twofa-code-input:-webkit-autofill,
  .twofa-body input.twofa-code-input:-webkit-autofill:hover,
  .twofa-body input.twofa-code-input:-webkit-autofill:focus{
    -webkit-text-fill-color: #fff !important;
    caret-color: #fff;
    box-shadow: 0 0 0px 1000px var(--panel) inset;
    transition: background-color 9999s ease-in-out 0s;
  }
  .twofa-body .form-control:focus{
    border-color:#ff8c42;
    box-shadow:none;
  }
</style>

<div class="container twofa-wrap">
  <div class="twofa-card">
    <div class="twofa-header">
      <h1 class="twofa-title">Verificación 2FA</h1>
      <p class="twofa-subtitle">Ingresa el código de tu Authenticator para <b>{{ username }}</b>.</p>
    </div>
    <div class="twofa-body">
      <form method="POST" action="{{ url_for('twofa_login_verify') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3">
          <label class="form-label" style="color:#ffc107; font-weight:700;">Código (6 dígitos)</label>
          <input class="form-control twofa-code-input" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required>
        </div>
        <button class="btn btn-primary w-100 fw-bold" style="border-radius: 12px;">Verificar</button>
      </form>
      <div class="mt-3 text-center">
        <a href="{{ url_for('login') }}" class="btn btn-link" style="color:#ffc107; text-decoration:none;">Volver al login</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
