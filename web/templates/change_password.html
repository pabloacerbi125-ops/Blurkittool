{% extends 'base.html' %}
{% block title %}Cambiar Contraseña{% endblock %}
{% block content %}
<style>
  .cp-wrap{ max-width: 560px; margin: 2.5rem auto 0; }
  .cp-card{
    background: var(--panel);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
  }
  .cp-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap: 12px;
    padding: 16px 18px;
    background: linear-gradient(180deg, rgba(255,204,0,0.10), rgba(255,255,255,0.02));
    border-bottom: 1px solid var(--card-border);
  }
  .cp-title{ margin:0; color:#fff; font-weight: 800; letter-spacing: 0.2px; }
  .cp-subtitle{ margin: 4px 0 0 0; color: var(--muted); font-size: 0.92rem; }
  .cp-body{ padding: 18px; }
  .cp-body .form-control{
    background: var(--panel);
    border: 1px solid var(--card-border);
    color: #fff;
    border-radius: 12px;
    padding: 0.75rem 0.9rem;
  }
  .cp-body .form-control:focus{
    border-color:#ff8c42;
    box-shadow:none;
  }
  .cp-hint{ color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
  .cp-actions{ margin-top: 14px; }
</style>

<div class="container cp-wrap">
  <div class="cp-card">
    <div class="cp-header">
      <div>
        <h1 class="cp-title">Cambiar contraseña</h1>
        <p class="cp-subtitle">Actualiza tu contraseña para mantener tu cuenta segura.</p>
      </div>
    </div>

    <div class="cp-body">
      <form method="POST" class="form-modern" autocomplete="off">
        <div class="mb-3">
          <label for="current_password" class="form-label">Contraseña actual</label>
          <input
            type="password"
            class="form-control"
            id="current_password"
            name="current_password"
            required
            autofocus
            autocomplete="current-password"
          >
        </div>

        <div class="mb-3">
          <label for="new_password" class="form-label">Nueva contraseña</label>
          <input
            type="password"
            class="form-control"
            id="new_password"
            name="new_password"
            required
            autocomplete="new-password"
          >
          <div class="cp-hint">Recomendado: usa una contraseña única (no reutilizada).</div>
        </div>

        <div class="mb-3">
          <label for="confirm_password" class="form-label">Confirmar nueva contraseña</label>
          <input
            type="password"
            class="form-control"
            id="confirm_password"
            name="confirm_password"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="cp-actions">
          <button type="submit" class="btn btn-primary w-100 fw-bold" style="border-radius: 12px;">
            Cambiar contraseña
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
