{% extends 'base.html' %}
{% block content %}
<style>
  /* CSS base del contenedor */
  #core-doc {
    width: 100%;
    overflow-x: auto;
    background: transparent;
    color: #e6eef3;
  }

  /* Centrar el bloque del documento (que no quede pegado a un lado) */
  #core-doc .core-doc__inner {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 18px;
    box-sizing: border-box;
    text-align: center;
  }

  /* Centrar todo el texto tipo Word */
  #core-doc p,
  #core-doc span,
  #core-doc div,
  #core-doc li,
  #core-doc td,
  #core-doc th,
  #core-doc h1,
  #core-doc h2,
  #core-doc h3,
  #core-doc h4,
  #core-doc h5,
  #core-doc h6 {
    text-align: center !important;
  }

  /* Si el export trae cosas con position:absolute pueden montarse sobre texto.
     Forzamos a flujo normal dentro del doc para evitar superposición. */
  #core-doc [style*="position:absolute"],
  #core-doc [style*="position: absolute"] {
    position: static !important;
    left: auto !important;
    right: auto !important;
    top: auto !important;
    bottom: auto !important;
  }

  /* Evitar texto negro del export sobre fondo oscuro.
     Nota: el export puede traer estilos inline; para esos casos
     aplicamos una corrección por JS (más abajo). */

  /* Integración al fondo del sitio: evitar el "papel blanco" del export.
     Esto sacrifica fondos de celdas/tablas, pero hace que se vea dentro del tema. */
  #core-doc, #core-doc * {
    background: transparent !important;
    background-color: transparent !important;
  }

  /* Evitar imágenes flotantes/posicionadas que puedan montarse sobre el texto */
  #core-doc img {
    max-width: 100% !important;
    height: auto !important;
    display: block !important;
    margin: 18px auto !important;
    float: none !important;
    clear: both !important;
    position: static !important;
    z-index: auto !important;
  }

  /* Mantener tablas legibles en fondo oscuro */
  #core-doc table, #core-doc td, #core-doc th {
    border-color: rgba(255, 140, 0, 0.25) !important;
  }

  /* No forzamos tablas: si una tabla es ancha, que haga scroll horizontal
     para mantener la posición exacta del documento. */

  /* No forzar font/color aquí: si quieres "tal cual Drive",
     necesitamos respetar el CSS del documento. */
</style>
<div id="core-content" class="container-main" style="margin-top: 2rem; user-select: none; -webkit-user-select: none;">
  <h2 style="color: #ff8c00; text-align:center; margin-bottom:2rem;">Guía del core</h2>
  <div style="max-width: 100%; margin: 0 auto; border: 2px solid #ff8c00; box-shadow: 0 0 8px #ff8c0044; border-radius: 12px; overflow: hidden; background: transparent;">
    {% if doc_iframe_url %}
      <div style="background: transparent;">
        <iframe
          src="{{ doc_iframe_url }}"
          title="Guía del core"
          style="width:100%;height:82vh;border:0;display:block;"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
          allowfullscreen
        ></iframe>
      </div>
    {% else %}
      <div style="padding:1.5rem; overflow: auto;">
        {% if error_msg %}
          <p style="color:#ffb3b3; text-align:center;">{{ error_msg }}</p>
        {% elif doc_html %}
          {% if doc_css %}
            <style>{{ doc_css|safe }}</style>
          {% endif %}
          <div id="core-doc" style="border-radius:10px; margin: 0 auto;">
            <div class="core-doc__inner">
              {{ doc_html|safe }}
            </div>
          </div>
        {% else %}
          <p style="text-align:center; color:#fff; font-size:1.1rem;">La guía aún no está disponible.</p>
        {% endif %}
      </div>
    {% endif %}
  </div>
</div>
<script>
// Bloquear clic derecho
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
}, false);

// Bloquear selección, copiar, cortar, pegar, arrastrar
['copy','cut','paste','selectstart','dragstart'].forEach(function(evt) {
  document.addEventListener(evt, function(e) {
    e.preventDefault();
    return false;
  }, false);
});

// Bloquear teclas comunes de inspección y PrintScreen
document.addEventListener('keydown', function(e) {
  // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, Ctrl+S, Ctrl+Shift+C, PrintScreen
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
    (e.ctrlKey && (e.key === 'U' || e.key === 'S')) ||
    e.key === 'PrintScreen'
  ) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }
});

// Ocultar contenido si la ventana pierde foco (dificulta capturas con apps externas)
const coreContent = document.getElementById('core-content');
window.addEventListener('blur', function() {
  if(coreContent) coreContent.style.opacity = '0';
});
window.addEventListener('focus', function() {
  if(coreContent) coreContent.style.opacity = '1';
});

// Si Google Docs exporta texto negro (o casi negro), convertirlo a blanco
// para que sea legible sobre el fondo oscuro, respetando textos que ya
// usan colores (naranja, etc.).
function _parseRgb(color) {
  // Espera formatos: rgb(r,g,b) o rgba(r,g,b,a)
  const m = String(color).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/i);
  if (!m) return null;
  return {
    r: parseInt(m[1], 10),
    g: parseInt(m[2], 10),
    b: parseInt(m[3], 10),
    a: m[4] == null ? 1 : parseFloat(m[4])
  };
}

function _isNearBlack(rgb) {
  if (!rgb || rgb.a === 0) return false;
  // Luma aproximada (0..255). Umbral bajo = negro/casi negro.
  const luma = 0.2126 * rgb.r + 0.7152 * rgb.g + 0.0722 * rgb.b;
  return luma <= 45;
}

function fixBlackTextInCoreDoc() {
  const root = document.getElementById('core-doc');
  if (!root) return;

  // Elementos típicos con texto en Google Docs export.
  const nodes = root.querySelectorAll('p, span, li, td, th, h1, h2, h3, h4, h5, h6, a, div');
  nodes.forEach((el) => {
    // Solo si tiene texto visible
    const txt = (el.textContent || '').trim();
    if (!txt) return;

    const color = window.getComputedStyle(el).color;
    const rgb = _parseRgb(color);
    if (_isNearBlack(rgb)) {
      el.style.color = '#e6eef3';
    }
  });
}

// Ejecutar al cargar y un poquito después (por si el HTML llega grande)
document.addEventListener('DOMContentLoaded', () => {
  fixBlackTextInCoreDoc();
  setTimeout(fixBlackTextInCoreDoc, 250);
});
</script>
{% endblock %}
